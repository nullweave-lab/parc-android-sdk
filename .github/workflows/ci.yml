name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.13"
      - name: Test SDK and build both runnable APKs
        run: gradle :sdk:testDebugUnitTest :sample:assembleDebug :app:assembleDebug
      - name: Verify APK outputs and record digests
        run: |
          test -s sample/build/outputs/apk/debug/sample-debug.apk
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum sample/build/outputs/apk/debug/sample-debug.apk | tee sample-debug.apk.sha256
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app-debug.apk.sha256
      - name: Upload control-plane sample APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: parc-android-control-plane-sample-debug-apk
          path: |
            sample/build/outputs/apk/debug/sample-debug.apk
            sample-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload direct Keystore demo APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: parc-android-keystore-demo-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
