name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.13"
      - name: Test SDK and build runnable APK
        run: gradle :sdk:testDebugUnitTest :sample:assembleDebug
      - name: Verify APK and record digest
        run: |
          test -f sample/build/outputs/apk/debug/sample-debug.apk
          sha256sum sample/build/outputs/apk/debug/sample-debug.apk | tee sample-debug.apk.sha256
      - name: Upload runnable APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: parc-test-client-debug
          path: |
            sample/build/outputs/apk/debug/sample-debug.apk
            sample-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
